<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>図書検索</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>📚 図書検索</h1>
    <p>CiNii Books・openBD を利用した書誌検索</p>
</header>

<main>

    <!-- 検索フォーム -->
    <section class="search-area">

        <input
            type="text"
            id="keyword"
            placeholder="タイトル・著者・キーワードを入力">

        <button id="searchButton">
            🔍 検索
        </button>

    </section>

    <!-- 件数表示 -->
    <div id="resultCount"></div>

    <!-- 検索結果 -->
    <section id="results" class="book-grid">

        <!-- JavaScriptでカードを追加 -->

    </section>

</main>

<script src="script.js"></script>

</body>
</html>
